apiVersion: 1

# Dev datasource pointing at Doover staging. Export these before `docker compose up`:
#   DOOVER_ORG_ID, DOOVER_CLIENT_ID, DOOVER_CLIENT_SECRET
datasources:
  - name: 'doover'
    type: 'getdoover-doover-datasource'
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      baseUrl: 'https://data.staging.udoover.com'
      orgId: '$DOOVER_ORG_ID'
      clientId: '$DOOVER_CLIENT_ID'
    secureJsonData:
      clientSecret: '$DOOVER_CLIENT_SECRET'
